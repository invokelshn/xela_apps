<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>xela_taxel_viz_core demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1e24; color: #ddd; font-family: sans-serif; }
  #status { position: absolute; top: 8px; left: 8px; z-index: 10; font-size: 13px; }
  #canvasHost { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="status">status: init</div>
<div id="canvasHost"></div>
<script type="module">
import { buildRuntimeConfig } from "../js/core/runtime_config.js";
import { createAppState } from "../js/core/app_state.js";
import { createRosbridgeClient } from "../js/core/rosbridge_client.js";

const statusEl = document.getElementById("status");
const setStatus = (text, ok) => {
  statusEl.textContent = `status: ${text}`;
  statusEl.style.color = ok ? "#7f7" : "#f77";
};

// Phase 1 standalone check only -- no model-specific topic/ns defaults, so this
// demo just exercises connect/retry against whatever ?ws= is passed (or the
// generic port fallbacks in runtime_config.js).
const config = buildRuntimeConfig(window);
const state = createAppState(config);

const client = createRosbridgeClient({
  state,
  wsCandidates: config.wsCandidates,
  setStatus,
  onOpen: () => setStatus(`connected (${state.activeWsUrl})`, true),
  onCloseOpened: () => setStatus("disconnected, retrying...", false),
  onMessageParsed: () => {},
});

setStatus("connecting...", false);
client.connect(0);

window.addEventListener("beforeunload", () => client.close());
</script>
</body>
</html>
