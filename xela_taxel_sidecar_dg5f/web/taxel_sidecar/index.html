            normalizeFrameId(src?.robotRootLink || ""),
            "base_link",
            "base_link_inertia",
            "base",
            "base_footprint",
          ].filter((n, idx, arr) => n && arr.indexOf(n) === idx);
          let foundBase = false;
          for (const name of preferredBaseLinks) {
            const group = m.linkGroups.get(name);
            if (!group || !group.visible) continue;
            const basePos = new THREE.Vector3();
            group.getWorldPosition(basePos);
            center.set(basePos.x, basePos.y, 0.0);
            foundBase = true;
            break;
          }
          if (!foundBase) {
            center.set(0, 0, 0);
          }
        }

        m.controls.target.copy(center);
        // Camera offset dominated by +X (2026-08-24, measured not guessed): live TF
        // for base_f3_prox_uSPa22_link / base_f3_mid_uSPa22_link / base_palm_uSPa46_link
        // all report an identical Ry(90 deg) rotation relative to world, which maps each
        // pad's local +Z (sensing-surface normal, per uSPa22_dg5f.xacro/uSPa46_dg5f.xacro's
        // own +Z taxel offsets) to world +X. The previous offsets (dominant +X but also
        // large -Y/+-Z components, then a -Z-dominant guess) both under- or mis-weighted
        // this -- a camera placed mostly along +X, looking back toward -X, is what
        // actually faces the sensing surfaces head-on.
        m.camera.position.set(
          center.x + radius * 2.4,
          center.y - radius * 0.5,
          center.z + radius * 0.6,
        );
        m.camera.near = Math.max(radius / 1000.0, 0.0005);
        m.camera.far = Math.max(radius * 600.0, 20.0);
        m.camera.updateProjectionMatrix();
        applyOrbitProfileForMode();
        m.controls.update();
        m.autoFrameDone = true;
      }

      function resolveFrameToFixed(frame, fixedFrame, cache, visiting, allowLooseRoot = false) {
        const m = state.urdfMesh;
        const fixed = normalizeFrameId(fixedFrame);
        const rawFrame = normalizeFrameId(frame);
        if (!rawFrame) return null;
        const resolvedFrame = resolveChildFrameAlias(rawFrame) || rawFrame;
        if (resolvedFrame === fixed || rawFrame === fixed) {
          return { tx: 0, ty: 0, tz: 0, qx: 0, qy: 0, qz: 0, qw: 1 };
        }
        if (cache.has(resolvedFrame)) return cache.get(resolvedFrame);
        if (visiting.has(resolvedFrame)) return null;
        visiting.add(resolvedFrame);
        const edge = m.tfEdges.get(resolvedFrame);
        if (!edge) {
          visiting.delete(resolvedFrame);
          if (allowLooseRoot) {
            const isKnownGraphFrame = m.tfParentFrames.has(resolvedFrame) || m.tfEdges.has(resolvedFrame);
            if (!isKnownGraphFrame) {
              return null;
            }
            const root = { tx: 0, ty: 0, tz: 0, qx: 0, qy: 0, qz: 0, qw: 1 };
            cache.set(resolvedFrame, root);
            return root;
          }
          return null;
        }
        const parentTf = resolveFrameToFixed(edge.parent, fixed, cache, visiting, allowLooseRoot);
        visiting.delete(resolvedFrame);
        if (!parentTf) return null;

        const THREE = m.THREE;
        const parentQ = new THREE.Quaternion(parentTf.qx, parentTf.qy, parentTf.qz, parentTf.qw);
        const localQ = new THREE.Quaternion(edge.qx, edge.qy, edge.qz, edge.qw);
        const combinedQ = parentQ.clone().multiply(localQ);
        const localT = new THREE.Vector3(edge.tx, edge.ty, edge.tz).applyQuaternion(parentQ);
        const combinedT = localT.add(new THREE.Vector3(parentTf.tx, parentTf.ty, parentTf.tz));
        const out = {
          tx: combinedT.x,
          ty: combinedT.y,
          tz: combinedT.z,
          qx: combinedQ.x,
          qy: combinedQ.y,
          qz: combinedQ.z,
          qw: combinedQ.w,
        };
        cache.set(resolvedFrame, out);
        return out;
      }

      function updateRobotLinkTransforms(fixedFrame, allowLooseRootFallback = true) {
        const m = state.urdfMesh;
        if (!m.ready || !m.robotBuilt) return { total: 0, visibleCount: 0, missingCount: 0, fallbackVisibleCount: 0 };
        const parentFrames = new Set();
        for (const edge of m.tfEdges.values()) {
          if (edge.parent) parentFrames.add(normalizeFrameId(edge.parent));
        }
        m.tfParentFrames = parentFrames;
        const strictCache = new Map();
        const strictVisiting = new Set();
        const looseCache = new Map();
        const looseVisiting = new Set();
        let visibleCount = 0;
        let missingCount = 0;
        let fallbackVisibleCount = 0;
        for (const [linkName, group] of m.linkGroups.entries()) {
          let tf = resolveFrameToFixed(linkName, fixedFrame, strictCache, strictVisiting, false);
          let usedFallback = false;
          if (!tf && allowLooseRootFallback) {
            tf = resolveFrameToFixed(linkName, fixedFrame, looseCache, looseVisiting, true);
            usedFallback = !!tf;
          }
          if (!tf) {
            group.visible = false;
            missingCount += 1;
            continue;
          }
          group.visible = true;
          group.position.set(tf.tx, tf.ty, tf.tz);
          group.quaternion.set(tf.qx, tf.qy, tf.qz, tf.qw);
          visibleCount += 1;
          if (usedFallback) {
            fallbackVisibleCount += 1;
          }
        }
        const stats = {
          total: m.linkGroups.size,
          visibleCount,
          missingCount,
          fallbackVisibleCount,
        };
        m.lastTfStats = stats;
        m.tfFallbackActive = fallbackVisibleCount > 0;
        return stats;
      }

      function ensureMarkerObject(key) {
        const m = state.urdfMesh;
        const THREE = m.THREE;
        if (m.markerMap.has(key)) {
          return m.markerMap.get(key);
        }
        const group = new THREE.Group();
        // Segment count bumped 10x10 -> 24x16 (2026-08-24, user feedback: taxel
        // dots looked "crude" now that the embedded-PointLight bug fix let
        // proper shading actually show their faceting) -- still cheap at this
        // radius, 124 taxels total. Radius trimmed 0.0026 -> 0.002 (user
        // feedback: liked the smoother look but dots read too large).
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.002, 24, 16),
          new THREE.MeshStandardMaterial({ color: 0x60a5fa, roughness: 0.2, metalness: 0.0 }),
        );
        const arrow = new THREE.ArrowHelper(
          new THREE.Vector3(1, 0, 0),
          new THREE.Vector3(0, 0, 0),
          0.006,
          0xf8fafc,
          0.0024,
          0.0016,
        );
        group.add(sphere);
        group.add(arrow);
        m.markerGroup.add(group);
        const marker = { group, sphere, arrow };
        m.markerMap.set(key, marker);
        return marker;
      }

      function resolveMarkerPose(frameId, fixedFrame, strictCache, strictVisiting, looseCache, looseVisiting) {
        const frame = resolveChildFrameAlias(frameId) || normalizeFrameId(frameId);
        if (!frame) return null;
        let tf = resolveFrameToFixed(frame, fixedFrame, strictCache, strictVisiting, false);
        if (tf) return tf;
        return resolveFrameToFixed(frame, fixedFrame, looseCache, looseVisiting, true);
      }

      // RobotModel-tab taxel markers were sitting at a fixed spot near the UR7e
      // base regardless of arm/hand motion (2026-08-24), even after adding the
      // missing light robot_state_publisher so the housing meshes track
      // correctly. Root cause: resolveFrameToFixed's "robot" source
      // (m.tfEdges bound to state.urdfSources.robot.tfEdges while
      // uiMode==="robot") never has a tf edge for the taxel's own specific
      // joint frame (e.g. x_taxel_1_f3_dg5f_ft_09_joint) -- only the housing
      // links resolve there. Its allowLooseRoot fallback then silently treats
      // any frame it can't find as sitting at identity relative to the fixed
      // frame, i.e. at the robot's own origin -- exactly the "stuck near
      // base" symptom. AH's std_xela_taxel_viz_ahv4 (a ROS node, not this web
      // sidecar) sidesteps this whole class of bug by publishing markers
      // tagged with their own frame_id and letting RViz's real tf2 transform
      // them -- there's no JS equivalent to lean on here, so instead: get the
      // taxel's fixed local offset from its housing link using the XELA
      // source's tf (which DOES have every taxel edge, confirmed by the
      // XelaModel tab working), then parent the marker onto the ROBOT
      // source's housing link group (already correctly tracking the real
      // arm/hand, confirmed by the housing mesh itself rendering correctly)
      // instead of re-deriving a world position by walking the robot
      // source's own (incomplete) tf tree.
      function resolveTaxelLocalOffsetViaXela(frameId, housingLinkName) {
        const m = state.urdfMesh;
        const frame = resolveChildFrameAlias(frameId) || normalizeFrameId(frameId);
        if (!frame || !housingLinkName) return null;
        const savedEdges = m.tfEdges;
        const savedParents = m.tfParentFrames;
        m.tfEdges = state.urdfSources.xela.tfEdges;
        // bindActiveUrdfSourceToMesh only rebinds tfEdges per source, not
        // tfParentFrames -- it's normally recomputed fresh off m.tfEdges by
        // updateRobotLinkTransforms(). Recompute it here the same way against
        // the swapped-in xela edges so allowLooseRoot's "known graph frame"
        // check still matches xela's tree, not whatever the robot source last
        // left behind.
        const parentFrames = new Set();
        for (const edge of m.tfEdges.values()) {
          if (edge.parent) parentFrames.add(normalizeFrameId(edge.parent));
        }
        m.tfParentFrames = parentFrames;
        try {
          const cache = new Map();
          const visiting = new Set();
          return resolveFrameToFixed(frame, housingLinkName, cache, visiting, false);
        } finally {
          m.tfEdges = savedEdges;
          m.tfParentFrames = savedParents;
        }
      }

      // Same fix as the marker-placement one above, generalized for any
      // caller that needs a taxel frame's pose relative to fixedFrame (2026-
      // 08-24: FollowCam's computeModuleCenterFromTf hit the identical bug --
      // it also resolves taxel dot frames directly against whichever source
      // is active, so in RobotModel mode it always got null/degenerate
      // results and FollowCam never activated). Tries the normal direct
      // resolution first (this is the only path taken in XelaModel mode,
      // where it already works), and only falls back to the
      // housing-plus-local-offset composition when that fails.
      function resolveTaxelFixedFramePoseRobust(frameId, fixedFrame, strictCache, strictVisiting) {
        const m = state.urdfMesh;
        const frame = resolveChildFrameAlias(frameId) || normalizeFrameId(frameId);
        if (!frame) return null;
        const direct = resolveFrameToFixed(frame, fixedFrame, strictCache, strictVisiting, false);
        if (direct) return direct;
        if (state.uiMode !== "robot") return null;
        const moduleId = extractModuleIdFromName(frameId);
        const housingLinkName = moduleId ? `base_${moduleId}_link` : "";
        if (!housingLinkName) return null;
        const housingTf = resolveFrameToFixed(housingLinkName, fixedFrame, strictCache, strictVisiting, false);
        if (!housingTf) return null;
        const localOffset = resolveTaxelLocalOffsetViaXela(frameId, housingLinkName);
        if (!localOffset) return null;
        const THREE = m.THREE;
        const housingQ = new THREE.Quaternion(housingTf.qx, housingTf.qy, housingTf.qz, housingTf.qw);
        const localQ = new THREE.Quaternion(localOffset.qx, localOffset.qy, localOffset.qz, localOffset.qw);
        const combinedQ = housingQ.clone().multiply(localQ);
        const localT = new THREE.Vector3(localOffset.tx, localOffset.ty, localOffset.tz).applyQuaternion(housingQ);
        const combinedT = localT.add(new THREE.Vector3(housingTf.tx, housingTf.ty, housingTf.tz));
        return {
          tx: combinedT.x,
          ty: combinedT.y,
          tz: combinedT.z,
          qx: combinedQ.x,
          qy: combinedQ.y,
          qz: combinedQ.z,
          qw: combinedQ.w,
        };
      }

      const _arrowHsl = { h: 0, s: 0, l: 0 };
      function updateUrdfMarkers(payload) {
        const m = state.urdfMesh;
        if (!m.ready) return;
        const points = (payload?.urdf?.points && Array.isArray(payload.urdf.points)) ? payload.urdf.points : [];
        const liveKeys = new Set();
        const xyRange = Math.max(1e-6, Number(payload?.meta?.xy_force_range) || 0.8);
        const zRange = Math.max(1e-6, Number(payload?.meta?.z_force_range) || 14.0);
        const xyArrowGain = 3.0;
        const fixedFrame = normalizeFrameId(m.fixedFrame || payload?.fixed_frame || defaultFixedFrame);
        const strictCache = new Map();
        const strictVisiting = new Set();
        const looseCache = new Map();
        const looseVisiting = new Set();

        for (const p of points) {
          const key = `${p.module}:${p.sensor_index}`;
          liveKeys.add(key);
          const marker = ensureMarkerObject(key);
          marker.group.visible = true;

          let placedViaHousing = false;
          if (state.uiMode === "robot") {
            const moduleId = extractModuleIdFromName(p.frame_id);
            const housingLinkName = moduleId ? `base_${moduleId}_link` : "";
            const housingGroup = housingLinkName ? m.linkGroups.get(housingLinkName) : null;
            if (housingGroup) {
              if (marker.robotHousingLink !== housingLinkName) {
                marker.robotLocalOffset = resolveTaxelLocalOffsetViaXela(p.frame_id, housingLinkName);
                marker.robotHousingLink = housingLinkName;
              }
              if (marker.robotLocalOffset) {
                if (marker.group.parent !== housingGroup) {
                  housingGroup.add(marker.group);
                }
                marker.group.position.set(
                  marker.robotLocalOffset.tx,
                  marker.robotLocalOffset.ty,
                  marker.robotLocalOffset.tz,
                );
                marker.group.quaternion.set(
                  marker.robotLocalOffset.qx,
                  marker.robotLocalOffset.qy,
                  marker.robotLocalOffset.qz,
                  marker.robotLocalOffset.qw,
                );
                placedViaHousing = true;
              }
            }
          }
          if (!placedViaHousing) {
            if (marker.group.parent !== m.markerGroup) {
              m.markerGroup.add(marker.group);
            }
            const tfPose = resolveMarkerPose(
              p.frame_id,
              fixedFrame,
              strictCache,
              strictVisiting,
              looseCache,
              looseVisiting,
            );
            if (tfPose) {
              marker.group.position.set(tfPose.tx, tfPose.ty, tfPose.tz);
              marker.group.quaternion.set(tfPose.qx, tfPose.qy, tfPose.qz, tfPose.qw);
            } else {
              marker.group.position.set(Number(p.x) || 0, Number(p.y) || 0, Number(p.z) || 0);
              marker.group.quaternion.set(0, 0, 0, 1);
            }
          }
          // uSPa22 (mid/prox, 2x2) and uSPa46 (palm, 4x6) taxel dots read as
          // floating/protruding above their housing (2026-08-24 user
          // feedback) -- fingertip taxels looked fine as-is. Nudge just those
          // two sensor types slightly along the taxel frame's local Z (its
          // surface normal) so the sphere sits flush/embedded instead.
          // Root cause of "no change no matter what value I use"
          // (2026-08-24, confirmed by instrumenting String.prototype.includes
          // live): p.module is the hand side ("right"), not the sensor type --
          // it never matched "uSPa22"/"uSPa46" at all, so the else branch
          // (z=0) always ran regardless of what the other two branches said.
          // The sensor-type name only appears in p.frame_id (e.g.
          // "x_taxel_1_f3_mid_uSPa22_09_joint").
          // +0.0022 confirmed (2026-08-24) to float uSPa46 further out, not
          // less -- so +Z is outward, -Z is inward for these frames. Flipped.
          const frameIdStr = String(p.frame_id || "");
          if (frameIdStr.includes("uSPa46")) {
            marker.sphere.position.set(0, 0, -0.0028);
            marker.sphere.scale.setScalar(1);
          } else if (frameIdStr.includes("uSPa22")) {
            // uSPa22's taxel frame reads slightly tilted -- pushing the
            // sphere inward along local Z alone visibly drifted it off-center
            // from the housing's own raised dot nub. x/y/z/scale here were
            // dialed in against live screenshots (2026-08-24, user-confirmed
            // centered/flush) -- not derived analytically, so re-tune by eye
            // if uSPa22's mesh/mounting ever changes.
            marker.sphere.position.set(-0.0001, 0.0003, -0.0014);
            marker.sphere.scale.setScalar(0.85);
          } else {
            marker.sphere.position.set(0, 0, 0);
            marker.sphere.scale.setScalar(1);
          }

          const norm = Math.max(0, Math.min(1, Number(p.norm) || 0));
          const rgb = forceColorRgb(norm);
          marker.sphere.material.color.setRGB(rgb.r / 255, rgb.g / 255, rgb.b / 255);

          // Sidecar rendering convention: X axis is mirrored vs sensor stream.
          const fxRaw = -(Number(p.fx) || 0);
          const fyRaw = Number(p.fy) || 0;
          const fz = Number(p.fz) || 0;
          // URDF payload already contains module-wise sign normalization.
          const dir = new m.THREE.Vector3(
            (fxRaw / xyRange) * xyArrowGain,
            (fyRaw / xyRange) * xyArrowGain,
            fz / zRange,
          );
          const mag = dir.length();
          if (mag < 0.012) {
            marker.arrow.visible = false;
            continue;
          }
          marker.arrow.visible = true;
          dir.normalize();
          const length = clamp(0.004 + mag * 0.012, 0.004, 0.028);
          marker.arrow.setDirection(dir);
          // Head sized up from 0.35/0.22 of shaft length (2026-08-24, user
          // feedback: "make the arrow color read stronger") -- ArrowHelper's
          // shaft is an unshaded 1px THREE.Line, easy to lose against the
          // housing at this scale; the head is a solid MeshBasicMaterial cone,
          // so enlarging it is what actually reads as a bolder marker.
          marker.arrow.setLength(length, Math.min(0.011, length * 0.6), Math.min(0.007, length * 0.4));
          // Same intensity heatmap as the sphere (2026-08-24 fix for the
          // original flat-near-white arrow bug), boosted toward full
          // saturation/value so the color reads clearly rather than as a
          // pastel tint -- see forceColorRgb() in js/render/primitives.js.
          const arrowColor = new m.THREE.Color(rgb.r / 255, rgb.g / 255, rgb.b / 255);
          arrowColor.getHSL(_arrowHsl);
          arrowColor.setHSL(_arrowHsl.h, 1.0, Math.min(0.62, Math.max(0.42, _arrowHsl.l)));
          marker.arrow.setColor(arrowColor);
        }

        for (const [key, marker] of m.markerMap.entries()) {
          if (!liveKeys.has(key)) {
            marker.group.visible = false;
          }
        }
      }

      async function renderUrdfMesh(payload) {
        const m = state.urdfMesh;
        if (!m.ready) return false;
        bindActiveUrdfSourceToMesh(false);
        resizeUrdfMeshRenderer();
        if (!m.robotBuilt && m.robotDescriptionXml) {
          await buildUrdfRobotFromDescription();
        }
        if (!m.robotBuilt) return false;
        refreshUrdfModuleHighlight(payload);

        const fixedFrame = selectFixedFrame(getActiveUrdfSource(), payload?.fixed_frame || m.fixedFrame || defaultFixedFrame);
        m.fixedFrame = fixedFrame || "world";
        const allowLooseRootFallback = state.uiMode !== "robot";
        const tfStats = updateRobotLinkTransforms(m.fixedFrame, allowLooseRootFallback);
        if (tfStats.total > 0 && tfStats.visibleCount === 0) {
          const activeSource = getActiveUrdfSource();
          m.failReason =
            `No link transforms resolved from ${activeSource.tfTopic} (fixed_frame=${m.fixedFrame}).`;
          return false;
        }
        autoFrameUrdfMeshCamera(false);
        updateUrdfMarkers(payload);
        updateFollowCamera(performance.now());

        m.controls.update();
        m.renderer.render(m.scene, m.camera);
        return true;
      }

      function updateSmoothedVectors(payload) {
        updateSmoothedVectorsCore(state, payload, 0.22, state.uiMode);
      }

      function drawArrow(x0, y0, dx, dy, lineWidth, color) {
        drawArrowCanvas(ctx, x0, y0, dx, dy, lineWidth, color);
      }

      function handleRosbridgeMessage(msg) {
        if (msg.op === "status" && String(msg.level || "").toLowerCase() === "error") {
          const statusText = String(msg.msg || "");
          if (statusText !== state.lastRosbridgeErrorText) {
            state.lastRosbridgeErrorText = statusText;
            console.warn("[xela-sidecar] rosbridge error:", statusText);
          }
          if (/infer topic type|unknown topic type/i.test(statusText)) {
            state.sourceTopicSubscribed = false;
            setTimeout(() => ensureSourceSubscriptions(), 200);
          }
          return;
        }

        if (msg.op === "service_response" && msg.service === "/xela_viz_mode_manager/set_mode") {
          state.pendingSwitch = false;
          if (msg.result && msg.values && msg.values.success) {
            setHintText(`Mode switch accepted: ${msg.values.message || ""}`);
          } else {
            const reason = msg.values && msg.values.message ? msg.values.message : "service call failed";
            setHintText(`Mode switch failed: ${reason}`);
          }
          return;
        }

        const hasServiceCallId = typeof msg.id === "string" && state.sourceByServiceCallId.has(msg.id);
        const sourceNameFromService = state.sourceByService.get(msg.service);
        if (msg.op === "service_response" && (hasServiceCallId || sourceNameFromService)) {
          const sourceName = hasServiceCallId
            ? state.sourceByServiceCallId.get(msg.id)
            : sourceNameFromService;
          if (hasServiceCallId) {
            state.sourceByServiceCallId.delete(msg.id);
          }
          const src = state.urdfSources[sourceName];
          if (src) {
            src.pendingRobotDescriptionService = false;
          }
          const values = Array.isArray(msg.values?.values) ? msg.values.values : [];
          if (values.length > 0) {
            const first = values[0];
            const xml = typeof first?.string_value === "string" ? first.string_value : "";
            if (xml) {
              onRobotDescriptionMessage({ data: xml }, sourceName);
            }
          }
          return;
        }

        for (const src of Object.values(state.urdfSources)) {
          if (msg.topic === src.robotDescriptionTopic && msg.msg) {
            onRobotDescriptionMessage(msg.msg, src.name);
            return;
          }
          if (msg.topic === src.tfTopic && msg.msg) {
            onTfMessage(msg.msg, false, src.name);
            return;
          }
          if (msg.topic === src.tfStaticTopic && msg.msg) {
            onTfMessage(msg.msg, true, src.name);
            return;
          }
        }

        if (msg.topic === topic && msg.msg) {
          const data = msg.msg.data;
          if (typeof data !== "string") return;
          try {
            state.payload = JSON.parse(data);
            state.lastReceivedMs = performance.now();
            const prevRequestedMode = state.requestedVizMode;
            state.requestedVizMode = String(state.payload?.meta?.requested_viz_mode || "grid").toLowerCase();
            state.sidecarRenderMode = String(state.payload?.meta?.sidecar_render_mode || "grid-2d");
            state.modelName = String(state.payload?.meta?.model_name || "");
            if (!state.modeOverriddenByUser) {
              state.uiMode = state.requestedVizMode === "urdf" ? "xela" : "grid";
            }
            if (state.uiMode !== "grid" && state.requestedVizMode === "urdf" && prevRequestedMode !== "urdf") {
              resetUrdfCamera();
              requestRobotDescriptionViaService(getUrdfSourceForUiMode(), true);
            }
            updateSmoothedVectors(state.payload);
            updateModeButtons();
            const baselineReady = state.payload?.meta?.baseline_ready !== false;
            if (baselineReady) {
              rebaselineBtn.classList.remove("collecting");
              baselineStatusEl.classList.remove("collecting");
              baselineStatusEl.textContent = "Baseline: ready";
            } else {
              rebaselineBtn.classList.add("collecting");
              baselineStatusEl.classList.add("collecting");
              baselineStatusEl.textContent = "Baseline: collecting...";
            }
          } catch (_) {
          }
        }
      }
      const rosbridgeClient = createRosbridgeClient({
        state,
        wsCandidates,
        topicInfoEl: topicInfo,
        topicInfoTextFor: (activeWsUrl) =>
          `${topic} | xela:${xelaTfTopic} robot:${robotTfTopic} via ${activeWsUrl || wsCandidates.join(" | ")}`,
        setStatus,
        onOpen: () => {
          state.sourceTopicSubscribed = false;
          for (const src of Object.values(state.urdfSources)) {
            src.pendingRobotDescriptionService = false;
          }
          ensureSourceSubscriptions();
          requestRobotDescriptionViaService("xela", true);
          requestRobotDescriptionViaService("robot", true);
          updateModeButtons();
          updateVectorModeButton();
        },
        onCloseOpened: () => {
          state.pendingSwitch = false;
          setStatus("Disconnected", false);
        },
        onErrorOpened: () => {
          setStatus("Socket error", false);
        },
        onMessageParsed: handleRosbridgeMessage,
      });

      const DG5F_MODULE_NAMES = [
        "f1_dg5f_ft", "f2_dg5f_ft", "f3_dg5f_ft", "f4_dg5f_ft", "f5_dg5f_ft",
        "f1_mid_uSPa22", "f2_mid_uSPa22", "f3_mid_uSPa22", "f4_mid_uSPa22", "f5_mid_uSPa22",
        "f1_prox_uSPa22", "f2_prox_uSPa22", "f3_prox_uSPa22", "f4_prox_uSPa22", "f5_prox_uSPa22",
        "palm_uSPa46",
      ]; // same 16-module list as app_state.js's showModules

      // Dedicated connection for xela_atag_taxel_viewer's own service calls AND its
      // live_module_data topic -- see runtime_config.js's taxelViewerWsCandidates comment for why
      // this can't share the main rosbridgeClient connection above. Originally this topic was
      // subscribed on the main connection like every other topic, but real testing (2026-08-26)
      // found messages for a just-added module could sit undelivered for 10+ seconds (confirmed
      // via raw WS frame capture: the node was publishing correctly on every cycle, but this
      // connection's incoming frames never carried it) -- the main connection's /tf subscriptions
      // at 25ms throttle (~40Hz) appear to starve rosbridge_websocket_sidecar's single
      // SingleThreadedExecutor of the cycles needed to also forward this topic promptly, the same
      // root cause already found and fixed for service-call responses. Moving the SUBSCRIPTION
      // itself (not just service calls) onto the otherwise-idle dedicated connection sidesteps it.
      const taxelViewerWsState = { ws: null, connected: false, activeWsUrl: null };
      const taxelViewerRosbridgeClient = createRosbridgeClient({
        state: taxelViewerWsState,
        wsCandidates: taxelViewerWsCandidates,
        topicInfoEl: null,
        topicInfoTextFor: () => "",
        setStatus: () => {},
        onOpen: () => {
          taxelViewerWsState.ws.send(JSON.stringify({
            op: "subscribe",
            topic: "/xela_atag_taxel_viewer_node/live_module_data",
            queue_length: 1,
            throttle_rate: 0,
            type: "std_msgs/msg/String",
          }));
        },
        onMessageParsed: (msg) => {
          if (msg.op === "service_response" && typeof msg.service === "string") {
            taxelSessionPanel?.handleServiceResponse(msg.service, msg.values || {});
            return;
          }
          if (msg.op === "publish" && msg.topic === "/xela_atag_taxel_viewer_node/live_module_data" && msg.msg) {
            const data = msg.msg.data;
            if (typeof data === "string" && taxelSessionPanel) {
              try {
                taxelSessionPanel.pushLiveModuleData(JSON.parse(data));
              } catch (_) {
                // ignore malformed live payloads
              }
            }
          }
        },
      });
      taxelViewerRosbridgeClient.connect();

      const taxelSessionPanelHost = document.getElementById("taxelSessionPanelHost");
      const taxelSessionPanel = taxelSessionPanelHost
        ? createTaxelSessionPanel({
            container: taxelSessionPanelHost,
            sendServiceRequest: (serviceName, args) => taxelViewerRosbridgeClient.sendServiceRequest(serviceName, args),
            moduleNames: DG5F_MODULE_NAMES,
          })
        : null;

      function connect(candidateIndex = 0) {
        rosbridgeClient.connect(candidateIndex);
      }

      window.addEventListener("error", (event) => {
        const detail = event?.message || "Unknown script error";
        console.error("[xela-sidecar] window error:", event);
        setHintText(`Web error: ${detail}`);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const detail = safeErrorText(event?.reason);
        console.error("[xela-sidecar] unhandled rejection:", event?.reason);
        setHintText(`Web promise error: ${detail}`);
      });

      function requestModeSwitch(toUrdf) {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
          setHintText("Cannot switch mode: websocket disconnected.");
          return;
        }
        if (state.pendingSwitch) {
          setHintText("Mode switch already in progress.");
          return;
        }
        const target = toUrdf ? "urdf" : "grid";
        state.pendingSwitch = true;
        state.requestedVizMode = target;

        setHintText(`Switching viz_mode to ${target}...`);
        state.ws.send(JSON.stringify({
          op: "call_service",
          service: "/xela_viz_mode_manager/set_mode",
          type: "std_srvs/srv/SetBool",
          args: { data: !!toUrdf },
        }));

      function setUiMode(newMode) {
        if (!["grid", "xela", "robot"].includes(newMode)) {
          return;

        state.modeOverriddenByUser = true;
        const previous = state.uiMode;
        state.uiMode = newMode;
        updateModeButtons();
        if (previous !== newMode) {
          resetUrdfCamera();
        }
        applyOrbitProfileForMode();
        if (newMode === "grid") {
          requestModeSwitch(false);
          return;
        }
        bindActiveUrdfSourceToMesh(true);

      }

      function toggleGridVectorMode() {
        if (!vectorBtn) {
          return;
        }
        state.gridVectorMode = state.gridVectorMode === "xyz" ? "xy" : "xyz";
        updateVectorModeButton();
        const label = state.gridVectorMode === "xyz" ? "XYZ(resultant)" : "XY";
        setHintText(`Grid vector mode switched to ${label}.`);
      }

      function drawEmpty(text) {
        ctx.fillStyle = "#0b1222";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#93a4bf";
        ctx.font = `${Math.max(12, Math.floor(canvas.height * 0.03))}px monospace`;
        ctx.textAlign = "center";
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      }

      function drawGrid(payload) {
        drawGridMode({
          payload,
          ctx,
          canvas,
          state,
          forceColor,
          drawArrow,
          drawEmpty,
        });
      }

      function buildUrdfDisplayPoints(rawPoints, rows, cols, cellSize) {
        const moduleBuckets = new Map();
        for (const p of rawPoints) {
          const moduleName = p.module || "module";
          if (!moduleBuckets.has(moduleName)) {
            moduleBuckets.set(moduleName, []);
          }
          moduleBuckets.get(moduleName).push(p);
        }

        const preferred = ["left", "right"];
        const names = [...moduleBuckets.keys()].sort((a, b) => {
          const ai = preferred.indexOf(a);
          const bi = preferred.indexOf(b);
          if (ai >= 0 && bi >= 0) return ai - bi;
          if (ai >= 0) return -1;
          if (bi >= 0) return 1;
          return a.localeCompare(b);
        });

        const safeRows = Math.max(1, rows);
        const safeCols = Math.max(1, cols);
        const pitch = Math.max(0.006, cellSize);
        const moduleWidth = safeCols * pitch;
        const moduleGap = Math.max(0.03, pitch * 2.2);

        const laidOut = [];
        let cursorX = 0;
        for (let i = 0; i < names.length; i++) {
          const name = names[i];
          if (i > 0) {
            cursorX += moduleWidth + moduleGap;
          }

          const pts = moduleBuckets.get(name);
          for (const p of pts) {
            const idx = Math.max(0, Number(p.sensor_index) || 0);
            const row = Math.min(safeRows - 1, Math.floor(idx / safeCols));
            const col = Math.min(safeCols - 1, idx % safeCols);
            let lx = (col - (safeCols - 1) * 0.5) * pitch;
            let ly = ((safeRows - 1) * 0.5 - row) * pitch;
            if (name === "right") {
              // Rotate the right module 180 degrees on the flat display plane.
              lx = -lx;
              ly = -ly;
            }
            laidOut.push({
              ...p,
              x: cursorX + lx,
              y: ly,
              z: 0.0,
            });
          }
        }

        if (!laidOut.length) {
          return laidOut;
        }

        let minX = Number.POSITIVE_INFINITY;
        let maxX = Number.NEGATIVE_INFINITY;
        for (const p of laidOut) {
          minX = Math.min(minX, p.x);
          maxX = Math.max(maxX, p.x);
        }
        const centerX = (minX + maxX) * 0.5;
        for (const p of laidOut) {
          p.x -= centerX;
        }

        return laidOut;
      }

      function buildUrdfScene(payload) {
        const rawPoints = (payload.urdf && payload.urdf.points) || [];
        if (!rawPoints.length) {
          return null;
        }
        const rows = Math.max(1, Number(payload.grid?.rows) || 4);
        const cols = Math.max(1, Number(payload.grid?.cols) || 6);
        const cellSize = Math.max(0.006, Number(payload.grid?.cell_size) || 0.015);
        const points = buildUrdfDisplayPoints(rawPoints, rows, cols, cellSize);

        let cx = 0;
        let cy = 0;
        let cz = 0;
        let minX = Number.POSITIVE_INFINITY;
        let maxX = Number.NEGATIVE_INFINITY;
        let minY = Number.POSITIVE_INFINITY;
        let maxY = Number.NEGATIVE_INFINITY;
        let minZ = Number.POSITIVE_INFINITY;
        let maxZ = Number.NEGATIVE_INFINITY;

        const modules = new Map();
        for (const p of points) {
          cx += p.x;
          cy += p.y;
          cz += p.z;
          minX = Math.min(minX, p.x);
          maxX = Math.max(maxX, p.x);
          minY = Math.min(minY, p.y);
          maxY = Math.max(maxY, p.y);
          minZ = Math.min(minZ, p.z);
          maxZ = Math.max(maxZ, p.z);

          const name = p.module || "module";
          if (!modules.has(name)) {
            modules.set(name, new Map());
          }
          modules.get(name).set(Number(p.sensor_index), p);
        }

        const n = Math.max(1, points.length);
        cx /= n;
        cy /= n;
        cz /= n;

        const span = Math.max(maxX - minX, maxY - minY, maxZ - minZ, 0.04);
        state.lastSceneExtent = span;

        return {
          points,
          modules,
          center: { x: cx, y: cy, z: cz },
          rows: Math.max(2, Number(payload.grid?.rows) || 4),
          cols: Math.max(2, Number(payload.grid?.cols) || 6),
          span,
        };
      }

      function projectWorld(point, scene) {
        const cam = state.camera;
        const relX = (point.x - scene.center.x) + cam.panX;
        const relY = (point.y - scene.center.y) + cam.panY;
        const relZ = (point.z - scene.center.z);

        const cy = Math.cos(cam.yaw);
        const sy = Math.sin(cam.yaw);
        const cp = Math.cos(cam.pitch);
        const sp = Math.sin(cam.pitch);

        const x1 = cy * relX - sy * relY;
        const y1 = sy * relX + cy * relY;
        const z1 = relZ;

        const x2 = x1;
        const y2 = cp * y1 - sp * z1;
        const z2 = sp * y1 + cp * z1;

        const cameraDist = scene.span * 4.0 + 0.18;
        const depth = Math.max(0.05, cameraDist - z2);
        const persp = cameraDist / depth;
        const base = (Math.min(canvas.width, canvas.height) * 0.43 * cam.zoom) / Math.max(scene.span, 1e-4);
        const px = canvas.width * 0.5 + x2 * base * persp;
        const py = canvas.height * 0.5 - y2 * base * persp;

        return { x: px, y: py, z: z2, persp };
      }

      function drawUrdfFixed3D(payload) {
        const scene = buildUrdfScene(payload);
        if (!scene) {
          drawEmpty("URDF mode requested, but urdf.points is empty");
          return false;
        }

        ctx.fillStyle = "#0a1222";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const projectMap = new Map();
        for (const p of scene.points) {
          const key = `${p.module}:${p.sensor_index}`;
          projectMap.set(key, projectWorld(p, scene));
        }

        const tris = [];
        for (const [moduleName, moduleMap] of scene.modules.entries()) {
          for (let r = 0; r < scene.rows - 1; r++) {
            for (let c = 0; c < scene.cols - 1; c++) {
              const i00 = r * scene.cols + c;
              const i01 = r * scene.cols + c + 1;
              const i10 = (r + 1) * scene.cols + c;
              const i11 = (r + 1) * scene.cols + c + 1;

              const p00 = moduleMap.get(i00);
              const p01 = moduleMap.get(i01);
              const p10 = moduleMap.get(i10);
              const p11 = moduleMap.get(i11);
              if (!p00 || !p01 || !p10 || !p11) continue;

              const t1 = [p00, p01, p10];
              const t2 = [p10, p01, p11];
              for (const tri of [t1, t2]) {
                const proj = tri.map((p) => projectMap.get(`${p.module}:${p.sensor_index}`));
                const depth = (proj[0].z + proj[1].z + proj[2].z) / 3.0;
                tris.push({ moduleName, proj, depth });
              }
            }
          }
        }

        tris.sort((a, b) => a.depth - b.depth);
        for (const tri of tris) {
          const [a, b, c] = tri.proj;
          const fill = tri.moduleName === "left" ? "rgba(56,189,248,0.15)" : "rgba(20,184,166,0.15)";
          ctx.fillStyle = fill;
          ctx.strokeStyle = "rgba(148,163,184,0.22)";
          ctx.lineWidth = 1.0;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        const zRange = Math.max(1e-6, Number(payload.meta?.z_force_range) || 14.0);
        const xyRange = Math.max(1e-6, Number(payload.meta?.xy_force_range) || 0.8);
        for (const p of scene.points) {
          const key = `${p.module}:${p.sensor_index}`;
          const proj = projectMap.get(key);
          if (!proj) continue;

          const radius = clamp(3.0 * proj.persp, 2.2, 7.6);
          ctx.beginPath();
          ctx.fillStyle = forceColor(Number(p.norm) || 0);
          ctx.strokeStyle = "rgba(6,10,18,0.95)";
          ctx.lineWidth = 1.0;
          ctx.arc(proj.x, proj.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          const v = state.vectorEma.get(key) || { fx: Number(p.fx) || 0, fy: Number(p.fy) || 0 };
          const mag = Math.hypot(v.fx, v.fy);
          const nxy = mag / xyRange;
          if (nxy < 0.08) continue;

          const fxDisplay = -v.fx;
          const fyDisplay = (p.module === "left") ? -v.fy : v.fy;
          const q = {
            x: Number(p.x) + (fxDisplay / xyRange) * scene.span * 0.24,
            y: Number(p.y) + (fyDisplay / xyRange) * scene.span * 0.24,
            z: Number(p.z) + (Number(p.fz || 0) / zRange) * scene.span * 0.14,
          };
          const qProj = projectWorld(q, scene);
          drawArrow(
            proj.x,
            proj.y,
            qProj.x - proj.x,
            qProj.y - proj.y,
            clamp(1.0 * proj.persp, 1.0, 2.2),
            "rgba(241,245,249,0.88)",
          );
        }

        return true;
      }

      function render() {
        resizeCanvas();
        const wantsUrdfView = state.uiMode !== "grid";
        const activeSource = getActiveUrdfSource();

        if (!state.payload) {
          if (wantsUrdfView) {
            bindActiveUrdfSourceToMesh(false);
            if (!state.urdfMesh.ready && !state.urdfMesh.loading && !state.urdfMesh.failed) {
              ensureUrdfMeshRuntime().catch(() => { });
            }
            if (state.urdfMesh.ready) {
              const dummyPayload = {
                fixed_frame: state.urdfMesh.fixedFrame || defaultFixedFrame,
                urdf: { points: [] },
                meta: { xy_force_range: 0.8, z_force_range: 14.0 },
              };
              runUrdfRenderGuarded(dummyPayload, (okRender) => {
                if (okRender) {
                  setUrdf3DVisible(true);
                  setHintText("URDF mesh is ready. Waiting for /x_taxel_dg5f/web_state sensor payload.");
                  setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"} | waiting payload`);
                } else {
                  setUrdf3DVisible(false);
                  drawEmpty("URDF mesh mode waiting for robot_description/tf");
                  if (state.urdfMesh.failReason) {
                    setHintText(`URDF mesh pending: ${state.urdfMesh.failReason}`);
                    setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"} pending (tf)`);
                  } else {
                    setHintText(`Waiting for ${activeSource.robotDescriptionTopic} and ${activeSource.tfTopic}.`);
                    setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"} pending`);
                  }
                }
              });
            } else {
              setUrdf3DVisible(false);
              drawEmpty("Initializing URDF mesh renderer...");
              if (state.urdfMesh.failed) {
                setHintText(`URDF mesh init failed: ${state.urdfMesh.failReason || "unknown"}`);
                setModeInfoText("Sidecar: URDF mesh failed");
              } else {
                setHintText("Initializing URDF mesh renderer...");
                setModeInfoText("Sidecar: URDF init");
              }
            }
          } else {
            bumpUrdfRenderEpoch();
            setUrdf3DVisible(false);
            drawEmpty("Waiting for /x_taxel_dg5f/web_state ...");
            setHintText("No payload received yet. Check bridge launch and rosbridge connection.");
            setModeInfoText("Sidecar: GridMode");
          }
          updateModeButtons();
        } else {
          const modelLabel = state.modelName ? ` model=${state.modelName}` : "";
          if (wantsUrdfView) {
            bindActiveUrdfSourceToMesh(false);
            if (!state.urdfMesh.robotDescriptionXml) {
              requestRobotDescriptionViaService(activeSource.name, false);
            }
            if (state.urdfMesh.ready) {
              runUrdfRenderGuarded(state.payload, (okRender) => {
                if (!okRender) {
                  setUrdf3DVisible(false);
                  drawEmpty("URDF mesh mode waiting for robot_description/tf");
                  if (state.urdfMesh.failReason) {
                    setHintText(`URDF mesh pending: ${state.urdfMesh.failReason}`);
                    setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"} pending (tf)${modelLabel}`);
                  } else {
                    setHintText(`URDF mesh pending: waiting for ${activeSource.robotDescriptionTopic} and ${activeSource.tfTopic}.`);
                    setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"} pending${modelLabel}`);
                  }
                  return;
                }
                setUrdf3DVisible(true);
                if (state.urdfMesh.tfFallbackActive) {
                  setHintText("URDF Mesh 3D (local TF root fallback): fixed_frame chain not fully available.");
                } else {
                  setHintText(`URDF Mesh 3D: ${activeSource.robotDescriptionTopic} + ${activeSource.tfTopic}`);
                }
                setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"}${modelLabel}`);
              });
            } else {
              if (!state.urdfMesh.loading && !state.urdfMesh.failed) {
                ensureUrdfMeshRuntime().catch(() => { });
              }
              setUrdf3DVisible(false);
              drawEmpty("Initializing URDF mesh renderer...");
              if (state.urdfMesh.failed) {
                const reason = state.urdfMesh.failReason || "unknown";
                setHintText(`URDF mesh init failed: ${reason}`);
                setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"} failed${modelLabel}`);
              } else {
                setHintText("Initializing URDF mesh renderer...");
                setModeInfoText(`Sidecar: ${state.uiMode === "robot" ? "RobotModel" : "XelaModel"} init${modelLabel}`);
              }
            }
          } else {
            bumpUrdfRenderEpoch();
            setUrdf3DVisible(false);
            drawGrid(state.payload);
            setHintText("Grid 2D mode.");
            setModeInfoText(`Sidecar: GridMode${modelLabel}`);
          }
        }

        const nowMs = performance.now();
        const timelineNowMs = getTimelineNowMs(nowMs);
        if ((nowMs - state.lastStatsPaintMs) >= 120) {
          const ageMsRaw = state.lastReceivedMs > 0 ? (nowMs - state.lastReceivedMs) : NaN;
          const ageMs = Number.isFinite(ageMsRaw) ? Math.round(ageMsRaw / 50) * 50 : NaN;
          const gridCount = state.payload?.grid?.points?.length || 0;
          const urdfCount = state.payload?.urdf?.points?.length || 0;
          const modeCount = wantsUrdfView ? `urdf=${urdfCount}` : `grid=${gridCount}`;
          const telemetry = computeAnalysisTelemetry(state.payload);
          sampleTimeline(telemetry, timelineNowMs);
          ingestAnalysisEvents(state.payload, telemetry, timelineNowMs);
          drawSparkline(timelineNowMs);

          const currentLine =
            `${Number.isFinite(telemetry?.tipF1Norm) ? ` tipF1=${telemetry.tipF1Norm.toFixed(3)}` : ""}` +
            `${Number.isFinite(telemetry?.tipF2Norm) ? ` tipF2=${telemetry.tipF2Norm.toFixed(3)}` : ""}` +
            `${Number.isFinite(telemetry?.activeCount) ? ` active=${Math.round(telemetry.activeCount)}` : ""}`;
          if (currentLine !== lastStatsCurrentText) {
            const trimmedCurrent = currentLine.trim();
            statsCurrent.textContent = trimmedCurrent;
            statsCurrent.title = trimmedCurrent;
            lastStatsCurrentText = currentLine;
          }
          const nextStats = Number.isFinite(ageMs)
            ? `age=${ageMs.toFixed(0)}ms ${modeCount} ui=${state.uiMode} src=${activeSource.name}` +
              `${Number.isFinite(telemetry?.pointCount) ? ` pts=${Math.round(telemetry.pointCount)}` : ""}` +
              `${Number.isFinite(telemetry?.normMean) ? ` norm_mean=${telemetry.normMean.toFixed(3)}` : ""}` +
              `${Number.isFinite(telemetry?.activeCount) ? ` active=${Math.round(telemetry.activeCount)}` : ""}`
            : `${modeCount} ui=${state.uiMode} src=${activeSource.name}` +
              `${Number.isFinite(telemetry?.pointCount) ? ` pts=${Math.round(telemetry.pointCount)}` : ""}` +
              `${Number.isFinite(telemetry?.normMean) ? ` norm_mean=${telemetry.normMean.toFixed(3)}` : ""}` +
              `${Number.isFinite(telemetry?.activeCount) ? ` active=${Math.round(telemetry.activeCount)}` : ""}`;
          const analysisSummary =
            `${Number.isFinite(telemetry?.normMean) ? `norm_mean=${telemetry.normMean.toFixed(3)}` : "norm_mean=-"}` +
            `${Number.isFinite(telemetry?.fzSum) ? ` fz_sum=${telemetry.fzSum.toFixed(3)}` : " fz_sum=-"}` +
            `${Number.isFinite(telemetry?.tipF1Norm) ? ` tipF1=${telemetry.tipF1Norm.toFixed(3)}` : " tipF1=-"}` +
            `${Number.isFinite(telemetry?.tipF2Norm) ? ` tipF2=${telemetry.tipF2Norm.toFixed(3)}` : " tipF2=-"}` +
            `${Number.isFinite(telemetry?.activeCount) ? ` active=${Math.round(telemetry.activeCount)}` : ""}`;
          if (nextStats !== state.lastStatsText) {
            statsText.textContent = analysisSummary;
            statsText.title = analysisSummary;
            briefStats.textContent = nextStats;
            briefStats.title = nextStats;
            state.lastStatsText = nextStats;
          }
          state.lastStatsPaintMs = nowMs;
        }

        requestAnimationFrame(render);
      }

      function resetUrdfCamera() {
        state.camera.yaw = 0.0;
        state.camera.pitch = 0.0;
        state.camera.zoom = 1.35;
        state.camera.panX = 0.0;
        state.camera.panY = 0.0;
      }

      // ── Simulate toolbar ──────────────────────────────────────────────
      // simSvcPrefix is built from simServerNode so that calling
      // simSvcPrefix + "/scenario_random" resolves to the absolute ROS
      // service path, e.g. "/xela_atag_mock_server/scenario_random".
      // Using a node-specific prefix means this UI never conflicts with
      // xela_taxel_sidecar_2f, which calls "/sim_xela_server/scenario_*".
      const simSvcPrefix = simServerNode
        ? "/" + simServerNode.replace(/^\/+/, "")
        : "";

      if (simSvcPrefix) {
        simBtn.style.display = "";
      }

      const simScenarioBtns = [
        simRandomBtn, simSilentBtn, simStepBtn, simRampBtn,
        simContactLossBtn, simPinchBtn, simTripodBtn, simPalmBtn,
      ];
      let simRowVisible = false;

      function setSimActive(btnEl, label) {
        simScenarioBtns.forEach((b) => b.classList.remove("active"));
        btnEl.classList.add("active");
        simStateBadge.textContent = `state: ${label}`;
      }

      function callSimService(serviceSuffix, btnEl, label) {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
          simStateBadge.textContent = "not connected";
          return;
        }
        state.ws.send(JSON.stringify({
          op: "call_service",
          service: simSvcPrefix + serviceSuffix,
          type: "std_srvs/srv/Trigger",
          args: {},
        }));
        setSimActive(btnEl, label);
      }

      simBtn.addEventListener("click", () => {
        simRowVisible = !simRowVisible;
        simulateRow.style.display = simRowVisible ? "" : "none";
        simBtn.classList.toggle("active", simRowVisible);
      });

      simRandomBtn.addEventListener("click", () =>
        callSimService("/scenario_random", simRandomBtn, "RANDOM"));
      simSilentBtn.addEventListener("click", () =>
        callSimService("/scenario_silent", simSilentBtn, "SILENT"));
      simStepBtn.addEventListener("click", () =>
        callSimService("/scenario_step", simStepBtn, "STEP"));
      simRampBtn.addEventListener("click", () =>
        callSimService("/scenario_ramp", simRampBtn, "RAMP"));
      simContactLossBtn.addEventListener("click", () =>
        callSimService("/scenario_contact_loss", simContactLossBtn, "C.LOSS"));
      simPinchBtn.addEventListener("click", () =>
        callSimService("/scenario_pinch", simPinchBtn, "PINCH"));
      simTripodBtn.addEventListener("click", () =>
        callSimService("/scenario_tripod", simTripodBtn, "TRIPOD"));
      simPalmBtn.addEventListener("click", () =>
        callSimService("/scenario_palm_press", simPalmBtn, "PALM"));
      // ── End simulate toolbar ──────────────────────────────────────────

      reconnectBtn.addEventListener("click", () => {
        connect();
      });
      gridBtn.addEventListener("click", () => setUiMode("grid"));
      xelaBtn.addEventListener("click", () => setUiMode("xela"));
      robotBtn.addEventListener("click", () => setUiMode("robot"));
      vectorBtn?.addEventListener("click", () => toggleGridVectorMode());
      followBtn?.addEventListener("click", () => {
        if (state.uiMode !== "robot") {
          return;
        }
        setFollowCamEnabled(!followCamState.enabled);
      });
      analysisBtn?.addEventListener("click", () => setAnalysisVisible(!analysisState.visible));

      const sensorViewAllBtn = document.getElementById("sensorViewAllBtn");
      const sensorViewActiveBtn = document.getElementById("sensorViewActiveBtn");
      function setSensorViewMode(mode) {
        state.sensorViewMode = mode;
        sensorViewAllBtn?.classList.toggle("active", mode === "all");
        sensorViewActiveBtn?.classList.toggle("active", mode === "active");
        state.urdfMesh.lastHighlightSignature = "";
        refreshUrdfModuleHighlight(state.payload);
        const showAll = mode === "all";
        rosbridgeClient.sendServiceRequest(
          `${runtimeConfig.bridgeNodeName}/set_parameters`,
          { parameters: [{ name: "show_all_modules", value: { type: 1, bool_value: showAll } }] }
        );
      }
      sensorViewAllBtn?.addEventListener("click", () => setSensorViewMode("all"));
      sensorViewActiveBtn?.addEventListener("click", () => setSensorViewMode("active"));

      rebaselineBtn?.addEventListener("click", () => {
        if (!state.connected) return;
        // Sent over the dedicated taxel-viewer rosbridge connection, not the main one -- the
        // main connection's heavy /tf etc. subscriptions starve service-call responses on
        // rosbridge_server's single executor (see runtime_config.js's taxelViewerWsCandidates
        // comment; confirmed 2026-08-26 this button never got a response over the main
        // connection either, same root cause as xela_atag_taxel_viewer's services).
        taxelViewerRosbridgeClient.sendServiceRequest("/reset_baseline", {});
        // Also re-trigger xela_atag_taxel_viewer_node's OWN baseline -- as of 2026-08-27 that
        // node is the system-wide CANONICAL baseline source (see its module docstring): it
        // broadcasts on a latched topic that xela_taxel_web_bridge_cpp (the /reset_baseline
        // call above) now subscribes to and applies automatically. Calling both here means one
        // click re-syncs the whole system (3D view + Session panel) instead of just this node's
        // own local copy -- the /reset_baseline call above is kept only as a fallback for when
        // xela_atag_taxel_viewer_node isn't running.
        taxelViewerRosbridgeClient.sendServiceRequest("/xela_atag_taxel_viewer_node/rebaseline", {});
        // Analysis tab's Session panel keeps its own rolling buffer for heatmap/chart auto-scale;
        // this is the single system-wide rebaseline trigger now (2026-08-27), so clear that
        // buffer here too instead of requiring a separate click on its own "Clear View" button.
        taxelSessionPanel?.clearLocalBuffer();
        rebaselineBtn.classList.add("collecting");
        baselineStatusEl.classList.add("collecting");
        baselineStatusEl.textContent = "Baseline: collecting...";
      });
      win10Btn?.addEventListener("click", () => setTimelineWindowMs(10000));
      win30Btn?.addEventListener("click", () => setTimelineWindowMs(30000));
      win60Btn?.addEventListener("click", () => setTimelineWindowMs(60000));
      pauseBtn?.addEventListener("click", () => setTimelinePaused(!timelineState.paused, performance.now()));
      sparkline?.addEventListener("mousemove", (ev) => {
        const rect = sparkline.getBoundingClientRect();
        hoverState.inside = true;
        hoverState.x = ev.clientX - rect.left;
        hoverState.y = ev.clientY - rect.top;
        updateEventTooltip(getTimelineNowMs(performance.now()));
      });
      sparkline?.addEventListener("mouseleave", () => {
        hoverState.inside = false;
        setEventTooltipVisible(false);
      });

      const moduleInputs = [
        { id: "chkF1", param: "show_f1", group: "f1" },
        { id: "chkF1Ft", param: "show_module_f1_dg5f_ft", group: "f1_dg5f_ft" },
        { id: "chkF1Mid", param: "show_module_f1_mid_uSPa22", group: "f1_mid_uSPa22" },
        { id: "chkF1Prox", param: "show_module_f1_prox_uSPa22", group: "f1_prox_uSPa22" },

        { id: "chkF2", param: "show_f2", group: "f2" },
        { id: "chkF2Ft", param: "show_module_f2_dg5f_ft", group: "f2_dg5f_ft" },
        { id: "chkF2Mid", param: "show_module_f2_mid_uSPa22", group: "f2_mid_uSPa22" },
        { id: "chkF2Prox", param: "show_module_f2_prox_uSPa22", group: "f2_prox_uSPa22" },

        { id: "chkF3", param: "show_f3", group: "f3" },
        { id: "chkF3Ft", param: "show_module_f3_dg5f_ft", group: "f3_dg5f_ft" },
        { id: "chkF3Mid", param: "show_module_f3_mid_uSPa22", group: "f3_mid_uSPa22" },
        { id: "chkF3Prox", param: "show_module_f3_prox_uSPa22", group: "f3_prox_uSPa22" },

        { id: "chkF4", param: "show_f4", group: "f4" },
        { id: "chkF4Ft", param: "show_module_f4_dg5f_ft", group: "f4_dg5f_ft" },
        { id: "chkF4Mid", param: "show_module_f4_mid_uSPa22", group: "f4_mid_uSPa22" },
        { id: "chkF4Prox", param: "show_module_f4_prox_uSPa22", group: "f4_prox_uSPa22" },

        { id: "chkF5", param: "show_f5", group: "f5" },
        { id: "chkF5Ft", param: "show_module_f5_dg5f_ft", group: "f5_dg5f_ft" },
        { id: "chkF5Mid", param: "show_module_f5_mid_uSPa22", group: "f5_mid_uSPa22" },
        { id: "chkF5Prox", param: "show_module_f5_prox_uSPa22", group: "f5_prox_uSPa22" },

        { id: "chkPalm", param: "show_palm", group: "palm" },
        { id: "chkPalmUSPa46", param: "show_module_palm_uSPa46", group: "palm_uSPa46" }
      ];

      moduleInputs.forEach(mod => {
        const el = document.getElementById(mod.id);
        if (el) {
          el.addEventListener("change", (e) => {
            const isChecked = e.target.checked;
            state.showModules[mod.group] = isChecked;
            refreshUrdfModuleHighlight(state.payload);
            const paramArg = {
              parameters: [
                {
                  name: mod.param,
                  value: { type: 1, bool_value: isChecked }
                }
              ]
            };
            const uriViz = `${runtimeConfig.vizNodeName}/set_parameters`;
            const uriBridge = `${runtimeConfig.bridgeNodeName}/set_parameters`;
            console.log("XELA TOGGLE CALL:", uriViz, paramArg);
            rosbridgeClient.sendServiceRequest(uriViz, paramArg);
            rosbridgeClient.sendServiceRequest(uriBridge, paramArg);
          });
        }
      });

      const groupToChildren = {
        "chkF1": ["chkF1Ft", "chkF1Mid", "chkF1Prox"],
        "chkF2": ["chkF2Ft", "chkF2Mid", "chkF2Prox"],
        "chkF3": ["chkF3Ft", "chkF3Mid", "chkF3Prox"],
        "chkF4": ["chkF4Ft", "chkF4Mid", "chkF4Prox"],
        "chkF5": ["chkF5Ft", "chkF5Mid", "chkF5Prox"],
        "chkPalm": ["chkPalmUSPa46"]
      };

      for (const [groupId, childIds] of Object.entries(groupToChildren)) {
        const groupEl = document.getElementById(groupId);
        if (groupEl) {
          groupEl.addEventListener("change", (e) => {
            const isChecked = e.target.checked;
            for (const childId of childIds) {
              const childEl = document.getElementById(childId);
              if (childEl) {
                childEl.disabled = !isChecked;
              }
            }
          });
        }
      }

      canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
      canvas.addEventListener("pointerdown", (ev) => {
        if (state.uiMode === "grid") return;
        state.drag = {
          id: ev.pointerId,
          x: ev.clientX,
          y: ev.clientY,
          yaw: state.camera.yaw,
          pitch: state.camera.pitch,
          panX: state.camera.panX,
          panY: state.camera.panY,
          panMode: ev.shiftKey || ev.button === 2,
        };
        canvas.setPointerCapture(ev.pointerId);
      });
      canvas.addEventListener("pointermove", (ev) => {
        if (!state.drag || state.drag.id !== ev.pointerId || state.uiMode === "grid") return;
        const dx = ev.clientX - state.drag.x;
        const dy = ev.clientY - state.drag.y;
        if (state.drag.panMode) {
          const k = (state.lastSceneExtent * 0.0022) / Math.max(0.25, state.camera.zoom);
          state.camera.panX = state.drag.panX + dx * k;
          state.camera.panY = state.drag.panY - dy * k;
          return;
        }
        state.camera.yaw = state.drag.yaw + dx * 0.008;
        state.camera.pitch = clamp(state.drag.pitch + dy * 0.006, -1.45, 1.45);
      });
      canvas.addEventListener("pointerup", (ev) => {
        if (state.drag && state.drag.id === ev.pointerId) {
          state.drag = null;
          canvas.releasePointerCapture(ev.pointerId);
        }
      });
      canvas.addEventListener("pointercancel", () => {
        state.drag = null;
      });
      canvas.addEventListener("wheel", (ev) => {
        if (state.uiMode === "grid") return;
        ev.preventDefault();
        const k = Math.exp(-ev.deltaY * 0.0012);
        state.camera.zoom = clamp(state.camera.zoom * k, 0.4, 3.6);
      }, { passive: false });
      canvas.addEventListener("dblclick", () => {
        if (state.uiMode === "grid") return;
        resetUrdfCamera();
      });

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("resize", resizeUrdfMeshRenderer);
      updateVectorModeButton();
      connect();
      render();

      setStatus("Connecting...", false);
      statusLine.title =
        `topic=${topic} xela_desc=${xelaRobotDescriptionTopic} xela_tf=${xelaTfTopic} ` +
        `robot_desc=${robotRobotDescriptionTopic} robot_tf=${robotTfTopic} ws_candidates=${wsCandidates.join(",")}`;
    })();
  </script>
</body>

</html>
